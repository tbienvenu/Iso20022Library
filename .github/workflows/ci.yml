name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # TreatWarningsAsErrors is set repo-wide in src/Directory.Build.props.
      - name: Build (all TFMs, zero warnings enforced)
        run: dotnet build src/iso20022.sln -c Release

      - name: Test net8.0
        run: dotnet test src/iso20022.sln -c Release --no-build --framework net8.0

      - name: Test net10.0
        run: dotnet test src/iso20022.sln -c Release --no-build --framework net10.0

  test-net462:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # .NET Framework test hosts run natively on Windows. Building this job separately avoids
      # depending on Linux/Mono support for the net462 test target.
      - name: Build all TFMs (zero warnings enforced)
        run: dotnet build src/iso20022.sln -c Release

      - name: Test the release tooling
        run: python3 -m unittest -q test_prepare_release
        working-directory: tools/releasing

      - name: Test Common net462
        run: dotnet test src/BeneficialStrategies.Iso20022.Common.Tests/BeneficialStrategies.Iso20022.Common.Tests.csproj -c Release --no-build --framework net462

      - name: Test FluentValidation net462
        run: dotnet test src/BeneficialStrategies.Iso20022.FluentValidation.Tests/BeneficialStrategies.Iso20022.FluentValidation.Tests.csproj -c Release --no-build --framework net462
